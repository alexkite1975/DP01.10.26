steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west2-docker.pkg.dev/drive-partners2/cloud-run-source-deploy/smarthaul-ui:$SHORT_SHA', '.']

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west2-docker.pkg.dev/drive-partners2/cloud-run-source-deploy/smarthaul-ui:$SHORT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smarthaul-ui'
      - '--image'
      - 'europe-west2-docker.pkg.dev/drive-partners2/cloud-run-source-deploy/smarthaul-ui:$SHORT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'europe-west2-docker.pkg.dev/drive-partners2/cloud-run-source-deploy/smarthaul-ui:$SHORT_SHA'
